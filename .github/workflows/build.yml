name: build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # обе версии для Mac собираются на Intel-машине: машин с M1 у GitHub часто не хватает
          - os: macos-15-intel
            target: aarch64-apple-darwin
            arch: aarch64
            bundles: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            bundles: app
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ядро sing-box
        shell: bash
        run: bash scripts/get-singbox.sh ${{ matrix.target }}
      - run: npm install --no-audit --no-fund
      - name: Сборка
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Образ .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/tide.app"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          codesign --force --deep -s - "$APP"
          mkdir -p dmg/root
          cp -R "$APP" dmg/root/
          ln -s /Applications dmg/root/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname tide -srcfolder dmg/root -ov -format UDZO "dmg/tide_${VER}_${{ matrix.arch }}.dmg" && break
            echo "Повтор через 15 секунд…"; sleep 15
          done
          ls -la dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tide-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE.md
